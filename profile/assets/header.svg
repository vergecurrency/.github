        <animate attributeName="y2" values="267;350" dur="4.08s" begin="-0.34s" calcMode="spline" keySplines=".55 0 1 1" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0;.12;.30;.38;0" keyTimes="0;.08;.35;.85;1" dur="4.08s" begin="-0.34s" repeatCount="indefinite"/>
      </line>
      <line x1="0" y1="267" x2="1120" y2="267" stroke="#05D9E8" stroke-width="1.2" opacity="0">
