    <text x="52" y="58" fill="#05D9E8" font-family="Inter,Arial,sans-serif" font-weight="700" font-size="16" letter-spacing="2">VERGE CURRENCY / OFFICIAL GITHUB</text>

    <text x="49" y="176" fill="#F5F3FF" font-family="Inter,Arial,sans-serif" font-weight="800" font-size="111" letter-spacing="11" class="headline">VERGE</text>

    <rect x="50" y="196" width="420" height="3" fill="url(#neon)" class="accent-line"/>
    <!-- Traveling light makes the animation visible, rather than only subtle opacity changes -->
    <g class="neon-scanner">
      <rect x="50" y="193" width="13" height="9" rx="4" fill="#FFFFFF" opacity=".98">
        <animate attributeName="x" values="50;454;50" keyTimes="0;.90;1" dur="3.5s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;.08;.88;1" dur="3.5s" repeatCount="indefinite"/>
      </rect>
      <rect x="52" y="194" width="8" height="7" rx="3" fill="#05D9E8">
        <animate attributeName="x" values="52;456;52" keyTimes="0;.90;1" dur="3.5s" repeatCount="indefinite"/>
      </rect>
