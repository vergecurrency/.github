      <line x1="0" y1="267" x2="1120" y2="267" stroke="#05D9E8" stroke-width="1.2" opacity="0">
        <animate attributeName="y1" values="267;350" dur="4.08s" begin="-2.38s" calcMode="spline" keySplines=".55 0 1 1" repeatCount="indefinite"/>
        <animate attributeName="y2" values="267;350" dur="4.08s" begin="-2.38s" calcMode="spline" keySplines=".55 0 1 1" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0;.12;.30;.38;0" keyTimes="0;.08;.35;.85;1" dur="4.08s" begin="-2.38s" repeatCount="indefinite"/>
      </line>
      <line x1="0" y1="267" x2="1120" y2="267" stroke="#05D9E8" stroke-width="1.2" opacity="0">
        <animate attributeName="y1" values="267;350" dur="4.08s" begin="-2.72s" calcMode="spline" keySplines=".55 0 1 1" repeatCount="indefinite"/>
        <animate attributeName="y2" values="267;350" dur="4.08s" begin="-2.72s" calcMode="spline" keySplines=".55 0 1 1" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0;.12;.30;.38;0" keyTimes="0;.08;.35;.85;1" dur="4.08s" begin="-2.72s" repeatCount="indefinite"/>
      </line>
      <line x1="0" y1="267" x2="1120" y2="267" stroke="#05D9E8" stroke-width="1.2" opacity="0">
        <animate attributeName="y1" values="267;350" dur="4.08s" begin="-3.06s" calcMode="spline" keySplines=".55 0 1 1" repeatCount="indefinite"/>
        <animate attributeName="y2" values="267;350" dur="4.08s" begin="-3.06s" calcMode="spline" keySplines=".55 0 1 1" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0;.12;.30;.38;0" keyTimes="0;.08;.35;.85;1" dur="4.08s" begin="-3.06s" repeatCount="indefinite"/>
      </line>
      <line x1="0" y1="267" x2="1120" y2="267" stroke="#05D9E8" stroke-width="1.2" opacity="0">
        <animate attributeName="y1" values="267;350" dur="4.08s" begin="-3.40s" calcMode="spline" keySplines=".55 0 1 1" repeatCount="indefinite"/>
        <animate attributeName="y2" values="267;350" dur="4.08s" begin="-3.40s" calcMode="spline" keySplines=".55 0 1 1" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0;.12;.30;.38;0" keyTimes="0;.08;.35;.85;1" dur="4.08s" begin="-3.40s" repeatCount="indefinite"/>
