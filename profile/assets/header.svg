        <animate attributeName="y1" values="267;350" dur="4.08s" begin="-3.74s" calcMode="spline" keySplines=".55 0 1 1" repeatCount="indefinite"/>
        <animate attributeName="y2" values="267;350" dur="4.08s" begin="-3.74s" calcMode="spline" keySplines=".55 0 1 1" repeatCount="indefinite"/>
