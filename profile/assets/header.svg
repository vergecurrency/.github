    <text x="52" y="240" fill="#FF2A6D" font-family="Inter,Arial,sans-serif" font-weight="700" font-size="19" letter-spacing="1.1" class="tagline">DECENTRALIZED. OPEN SOURCE. BUILT TO EVOLVE.</text>

    <text x="52" y="279" fill="#ABA5C9" font-family="Inter,Arial,sans-serif" font-weight="600" font-size="14" letter-spacing="2">EST. 2014 / XVG / COMMUNITY DRIVEN</text>

    <text x="1073" y="313" fill="#05D9E8" font-family="Inter,Arial,sans-serif" font-weight="600" font-size="12" letter-spacing="1" text-anchor="end">VERGE / 2026</text>

    <rect x="1" y="1" width="1118" height="348" rx="17" fill="none" stroke="#9D4EDD" stroke-opacity=".55" class="panel-border"/>

