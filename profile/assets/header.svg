<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="350" viewBox="0 0 1120 350" role="img" aria-label="Verge Currency — Decentralized, Open Source, Built to Evolve">
  <title>Verge Currency</title>

  <defs>
    <linearGradient id="ground" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#16082E"/>
      <stop offset="1" stop-color="#0D0221"/>
    </linearGradient>

    <linearGradient id="neon" x1="0" y1="0" x2="1" y2="0">
      <stop stop-color="#FF2A6D"/>
      <stop offset=".5" stop-color="#9D4EDD"/>
      <stop offset="1" stop-color="#05D9E8"/>
    </linearGradient>

    <linearGradient id="sun" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#FF9E00"/>
      <stop offset=".5" stop-color="#FF2A6D"/>
      <stop offset="1" stop-color="#9D4EDD"/>
    </linearGradient>

    <clipPath id="frame">
      <rect width="1120" height="350" rx="18"/>
    </clipPath>
  </defs>

  <style>
    .bg-frame { fill: url(#ground); }
    .sun { transform-origin: 850px 152px; }
    .stripe { fill: #0D0221; opacity: .88; }
    .grid-v { stroke: #9D4EDD; opacity: .35; stroke-width: 1; }
    .grid-h { stroke: #05D9E8; opacity: .14; stroke-width: 1; animation: gridGlow 5s ease-in-out infinite; }
    .starA { animation: twinkleA 4.5s ease-in-out infinite; }
    .starB { animation: twinkleB 6.5s ease-in-out infinite; }
    .starC { animation: twinkleC 5.4s ease-in-out infinite; }
    .accent-line { animation: accentShift 4.2s ease-in-out infinite; }
    .headline { animation: logoGlow 5s ease-in-out infinite; }
    .tagline { animation: tagGlow 5.8s ease-in-out infinite; }
    .panel-border { animation: borderGlow 4.8s ease-in-out infinite; }
    .corner-a { animation: cornerPulseA 4.2s ease-in-out infinite; }
    .corner-b { animation: cornerPulseB 4.8s ease-in-out infinite; }

    @keyframes sunPulse {
      0%, 100% { opacity: .70; transform: scale(1); }
      50% { opacity: 1; transform: scale(1.09); }
    }

    @keyframes twinkleA {
      0%, 100% { opacity: .22; }
      50% { opacity: .65; }
    }

    @keyframes twinkleB {
      0%, 100% { opacity: .18; }
      35% { opacity: .58; }
      70% { opacity: .32; }
    }

    @keyframes twinkleC {
      0%, 100% { opacity: .28; }
      50% { opacity: .75; }
    }

    @keyframes accentShift {
      0%, 100% { opacity: .9; filter: drop-shadow(0 0 1px #05D9E8); }
      50% { opacity: 1; filter: drop-shadow(0 0 6px #FF2A6D); }
    }

    @keyframes logoGlow {
      0%, 100% { filter: drop-shadow(0 0 0px rgba(245,243,255,0)); }
      50% { filter: drop-shadow(0 0 8px rgba(245,243,255,.14)); }
    }

    @keyframes tagGlow {
      0%, 100% { opacity: 1; }
      50% { opacity: .92; filter: drop-shadow(0 0 6px rgba(255,42,109,.18)); }
    }

    @keyframes gridGlow {
      0%, 100% { opacity: .10; }
      50% { opacity: .18; }
    }

    @keyframes borderGlow {
      0%, 100% { stroke-opacity: .45; }
      50% { stroke-opacity: .75; }
    }

    @keyframes cornerPulseA {
      0%, 100% { opacity: .9; }
      50% { opacity: .65; }
    }

    @keyframes cornerPulseB {
      0%, 100% { opacity: .9; }
      50% { opacity: .65; }
    }
    .neon-scanner { }
    @keyframes scanAcross {
      0% { transform: translateX(0px); opacity: 0; }
      8% { opacity: 1; }
      88% { opacity: 1; }
      100% { transform: translateX(410px); opacity: 0; }
    }
  </style>

