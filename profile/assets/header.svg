        <animate attributeName="y2" values="267;350" dur="4.08s" begin="-1.36s" calcMode="spline" keySplines=".55 0 1 1" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0;.12;.30;.38;0" keyTimes="0;.08;.35;.85;1" dur="4.08s" begin="-1.36s" repeatCount="indefinite"/>
